    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        height: 100%;
        overflow: hidden;
        font-family: 'Cairo', sans-serif;
    }

    body {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #7c1524;
        background-image:
            repeating-linear-gradient(45deg,  rgba(255,255,255,0.045) 0 2px, transparent 2px 42px),
            repeating-linear-gradient(-45deg, rgba(255,255,255,0.045) 0 2px, transparent 2px 42px),
            repeating-linear-gradient(45deg,  rgba(0,0,0,0.10) 0 1px, transparent 1px 21px),
            repeating-linear-gradient(-45deg, rgba(0,0,0,0.10) 0 1px, transparent 1px 21px),
            radial-gradient(circle at 50% 38%, rgba(255,150,150,0.10), transparent 60%);
        background-size: 42px 42px, 42px 42px, 21px 21px, 21px 21px, 100% 100%;
    }

    /* توهج خافت من الأسفل يمنح إحساساً بعمق دون تشتيت الانتباه */
    body::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0.35), transparent 55%);
        pointer-events: none;
    }

    .scene {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 2;
    }

    /* ==================== النجوم المتلألئة ==================== */
    .stars {
        position: absolute;
        inset: -40px -60px;
        pointer-events: none;
        z-index: 1;
    }
    .stars span {
        position: absolute;
        color: #ffe9a8;
        text-shadow: 0 0 6px rgba(255, 225, 150, 0.9);
        opacity: 0;
        animation: twinkle 2.6s ease-in-out infinite;
    }
    @keyframes twinkle {
        0%, 100% { opacity: 0; transform: scale(0.5) rotate(0deg); }
        50% { opacity: 1; transform: scale(1.15) rotate(20deg); }
    }

    /* ==================== رسم الزوجين + القلب النابض ==================== */
    .illustration {
        position: relative;
        width: 220px;
        height: 330px;
    }
    .couple-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 6px 18px rgba(0,0,0,0.45));
    }
    .heart-img {
        position: absolute;
        left: 50%;
        bottom: 14%;
        width: 108px;
        transform: translate(-50%, 50%);
        filter: drop-shadow(0 0 8px rgba(255, 221, 130, 0.95)) drop-shadow(0 0 22px rgba(212, 175, 55, 0.75));
        animation: heartbeat 1.15s ease-in-out infinite;
        transform-origin: center;
        z-index: 2;
    }
    @keyframes heartbeat {
        0%   { transform: translate(-50%, 50%) scale(1);    }
        14%  { transform: translate(-50%, 50%) scale(1.16); }
        28%  { transform: translate(-50%, 50%) scale(1);    }
        42%  { transform: translate(-50%, 50%) scale(1.10); }
        60%  { transform: translate(-50%, 50%) scale(1);    }
        100% { transform: translate(-50%, 50%) scale(1);    }
    }

    /* ==================== العنوان الذهبي البرّاق ==================== */
    .title {
        margin-top: 22px;
        font-family: 'RawaqDecor', 'Cairo', sans-serif;
        font-size: 3.1rem;
        line-height: 1.3;
        text-align: center;
        background: linear-gradient(100deg, #a5670f 0%, #ffe9a0 22%, #fff8dc 42%, #d89a2a 58%, #ffe9a0 78%, #a5670f 100%);
        background-size: 260% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        filter: drop-shadow(0 2px 6px rgba(0,0,0,0.45));
        animation: shimmer 3.4s linear infinite;
    }
    @keyframes shimmer {
        0%   { background-position: 0% 50%; }
        100% { background-position: 260% 50%; }
    }

    .subtitle {
        margin-top: 10px;
        font-size: 0.95rem;
        color: rgba(255,255,255,0.82);
        letter-spacing: 0.5px;
    }
    .subtitle .dots span {
        animation: dotFade 1.4s infinite;
        opacity: 0;
    }
    .subtitle .dots span:nth-child(1) { animation-delay: 0s; }
    .subtitle .dots span:nth-child(2) { animation-delay: 0.2s; }
    .subtitle .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotFade {
        0%, 100% { opacity: 0; }
        50% { opacity: 1; }
    }

    @media (max-width: 480px) {
        .illustration { width: 170px; height: 255px; }
        .heart-img { width: 70px; }
        .title { font-size: 2.3rem; }
    }
</style>
</head>
